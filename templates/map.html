{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cities Web Map - Advanced Web Mapping</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Custom styles (layout for the panels lives in here) -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div id="map"></div>

    <div class="control-panel">
        <h3>City Search</h3>
        <input type="text" id="searchInput" class="search-box" placeholder="Search by city or country..." autocomplete="off">
        <button id="resetBtn" class="btn-reset" type="button">Reset View</button>
        <div id="results"></div>
    </div>

    <div class="info-box">
        <h4>Map Information</h4>
        <p>Cities shown: <strong id="cityCount">0</strong> of <strong id="cityTotal">0</strong></p>
        <p>Click a marker to view city details.</p>
    </div>

    <div class="loading" id="loading">Loading cities data...</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Custom map script -->
    <script src="{% static 'js/map.js' %}"></script>
</body>
</html>
